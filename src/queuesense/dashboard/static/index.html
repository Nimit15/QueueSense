<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSense ICCC - 3D Living Digital Twin</title>
  <meta name="description" content="Edge-AI Adaptive Traffic-Signal Controller: 3D Living Digital Twin with Downstream Spillback Prevention">

  <!-- Three.js + WebGL -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/effects/EffectComposer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/effects/RenderPass.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/effects/UnrealBloomPass.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/shaders/FXAAShader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/BufferGeometryUtils.min.js"></script>

  <!-- Chart.js for inline telemetry charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/static/styles.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'IBM Plex Sans', 'Inter', system-ui, sans-serif;
    }

    #three-canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: var(--z-canvas);
    }

    /* Hide loading screen after init */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: var(--z-toast);
      transition: opacity 300ms var(--ease-out), visibility 300ms var(--ease-out);
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loading-spinner__dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
      box-shadow: var(--shadow-glow-emerald);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .loading-spinner__text {
      font-size: 13px;
      color: var(--fg-secondary);
      font-family: monospace;
    }

    .loading-spinner__progress {
      font-size: 11px;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-spinner">
      <div class="loading-spinner__dot"></div>
      <div class="loading-spinner__text">Initializing QueueSense 3D Digital Twin</div>
      <div class="loading-spinner__progress" id="loadingProgress">Loading assets... 0%</div>
    </div>
  </div>

  <!-- Three.js Canvas Container -->
  <div id="three-canvas-container"></div>

  <!-- Scripts -->
  <script type="module" src="/static/three-scene.js"></script>
  <script src="/static/hud-components.js"></script>

  <script>
    // =============================================================================
    // APPLICATION INITIALIZATION
    // =============================================================================

    let threeScene = null;
    let hud = null;
    let loadingProgress = 0;

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', async () => {
      await initApp();
    });

    async function initApp() {
      updateLoadingProgress(10, 'Loading 3D engine...');

      // Wait for Three.js to be available
      await new Promise(resolve => {
        const checkInterval = setInterval(() => {
          if (typeof THREE !== 'undefined') {
            clearInterval(checkInterval);
            resolve();
          }
        }, 50);
      });

      updateLoadingProgress(30, 'Initializing Digital Twin...');

      // Initialize Three.js scene
      const canvasContainer = document.getElementById('three-canvas-container');
      threeScene = initDigitalTwin(canvasContainer);

      updateLoadingProgress(60, 'Setting up HUD components...');

      // Initialize HUD
      hud = initHUD();

      // Wire up callbacks between scene and HUD
      threeScene.onPresetChange = (preset) => {
        const presetLabels = {
          isometric: '📐 Isometric',
          topDown: '🛰️ Top-Down',
          driver: '🎮 Driver View'
        };
        console.log('Camera preset changed to:', preset);
      };

      threeScene.onScenarioChange = (scenario) => {
        const scenarioNames = {
          normal: 'Normal Traffic Flow',
          surge: 'West Surge',
          spillback: 'Exit Road Jammed',
          emergency: 'Ambulance Priority',
          sensor_fault: 'Sensor Fault',
          recovery: 'Recovery'
        };
        console.log('Scenario changed to:', scenario);
      };

      threeScene.onModeChange = (isQueueSense) => {
        console.log('Mode changed to:', isQueueSense ? 'QueueSense AI' : 'Traditional');
        hud.setMode(isQueueSense ? 'queuesense' : 'traditional');
      };

      threeScene.onSignalUpdate = (signal) => {
        updateDecisionReceipt(signal);
      };

      threeScene.onZoneUpdate = (zones) => {
        console.log('AI zones updated:', zones);
      };

      threeScene.onTelemetry = (stats) => {
        updateTelemetryStats(stats);
      };

      // Load initial data
      updateLoadingProgress(80, 'Loading benchmark data...');
      await hud.loadAllData();

      updateLoadingProgress(100, 'Ready!');
      setTimeout(() => {
        fadeOutLoading();
      }, 300);
    }

    function updateLoadingProgress(percent, message) {
      loadingProgress = percent;
      const progressEl = document.getElementById('loadingProgress');
      if (progressEl) {
        progressEl.textContent = `${message} ${percent}%`;
      }
    }

    function fadeOutLoading() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 500);
      }
    }

    // =============================================================================
    // REAL-TIME STATE UPDATES
    // =============================================================================

    // Polling for real-time state updates
    let statePollInterval = null;
    let lastState = null;

    function startStatePolling() {
      if (statePollInterval) return;

      statePollInterval = setInterval(async () => {
        try {
          const response = await fetch('/api/state');
          const state = await response.json();

          if (state !== lastState) {
            updateFromAPI(state);
            lastState = state;
          }
        } catch (e) {
          console.error('State poll error:', e);
        }
      }, 1000); // 1 Hz polling
    }

    function updateFromAPI(state) {
      // Update decision receipt
      const action = state.action || {};
      const simplified = state.simplified || {};
      const pressures = state.pressures || {};

      hud.updateDecisionReceipt({
        phase: action.phase ? `Phase: ${action.phase}` : 'Unknown',
        countdown: action.countdown_label || `${Math.round(action.duration || 0)}s remaining`,
        queuePCU: simplified.queue_pcu || 0,
        queueVeh: simplified.queue_vehicles || 0,
        exitStatus: simplified.exit_status || 'CLEAR',
        body: simplified.decision_body || 'System running normally.',
        headline: simplified.decision_headline || 'NORMAL ADAPTIVE TRAFFIC FLOW',
        iconType: simplified.decision_class || 'normal',
      });

      // Update HUD pressures
      hud.state.pressures = pressures;

      // Update audit log
      if (state.audit_log) {
        hud.state.auditLog = state.audit_log;
      }

      // Update scenario pills
      if (state.active_preset) {
        hud.state.currentScenario = state.active_preset;
        hud.updateScenarioPills();
      }
    }

    function updateDecisionReceipt(signal) {
      // Update from Three.js signal updates
      const phaseMap = {
        'NORTH_SOUTH': 'NORTH-SOUTH GREEN',
        'EAST_WEST': 'EAST-WEST GREEN',
        'YELLOW_CLEARANCE': 'YELLOW CLEARANCE',
        'ALL_RED': 'ALL-RED SAFETY',
      };

      hud.updateDecisionReceipt({
        phase: phaseMap[signal.phase] || signal.phase || 'GREEN: NORTH-SOUTH',
        countdown: `${Math.round(signal.duration || 20)}s`,
        headline: signal.phase === 'NORTH_SOUTH' ? 'NORMAL ADAPTIVE TRAFFIC FLOW' :
                  signal.phase === 'EAST_WEST' ? 'SERVING EAST-WEST TRAFFIC' :
                  signal.phase === 'YELLOW_CLEARANCE' ? 'YELLOW CLEARANCE' :
                  signal.phase === 'ALL_RED' ? 'SAFETY CLEARANCE' : 'NORMAL FLOW',
        iconType: signal.phase === 'YELLOW_CLEARANCE' ? 'elevated' :
                  signal.phase === 'ALL_RED' ? 'blocked' :
                  signal.phase === 'EAST_WEST' ? 'normal' : 'normal',
        body: signal.reason || 'Signal phase active',
      });
    }

    function updateTelemetryStats(stats) {
      // Update FPS counter in HUD (if visible)
      const fpsElement = document.querySelector('[data-stat="fps"]');
      if (fpsElement) {
        fpsElement.textContent = stats.fps.toFixed(0);
      }

      hud.state.telemetry = stats;
    }

    // =============================================================================
    // GLOBAL EVENT HANDLERS (called from HTML onclick)
    // =============================================================================

    function triggerPreset(presetId) {
      hud.setScenario(presetId);
      threeScene.setScenario(presetId);
    }

    function switchCctvFeed(source) {
      console.log('Switching CCTV feed to:', source);
    }

    function toggleRoiCalibration() {
      console.log('ROI Calibration toggle');
    }

    function resetRoiToDefault() {
      console.log('Resetting ROI to default');
    }

    function clearRoiDraft() {
      console.log('Clearing ROI draft');
    }

    function saveRoiDraft() {
      console.log('Saving ROI draft');
    }

    function setSimMode(mode) {
      hud.setMode(mode);
      threeScene.setMode(mode === 'queuesense');
    }

    function startSimulation() {
      console.log('Starting simulation');
    }

    function resetSimulation() {
      console.log('Resetting simulation');
    }

    function toggleSimulation() {
      console.log('Toggling simulation');
    }

    // =============================================================================
    // AUTO-START SIMULATION
    // =============================================================================

    window.addEventListener('load', () => {
      startStatePolling();
    });

    // Export for external access
    window.app = {
      threeScene,
      hud,
      startStatePolling,
    };
  </script>

</body>
</html>
